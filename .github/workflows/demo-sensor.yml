name: Demo and Sensor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate sensor states through the simulated TCP relay
        run: python -m unittest discover -s scripts/sensor_bridge -v

  demo-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in 'core/host/demo.ps1', 'core/host/test_demo.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify startup order and failure handling without Docker or hardware
        shell: powershell
        run: ./core/host/test_demo.ps1

  psoc6-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sharing and PSoC 6 firmware with simulated machine and serial input
        run: python -m unittest discover -s scripts/guardian_share -v

  hub-and-local-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify hub, local sharing key, egress and local viewer HTTP
        run: |
          python -m unittest discover -s scripts/guardian_hub -v
          python -m unittest discover -s core/host -v
          python -m unittest discover -s core/egress -v
          python -m unittest discover -s core/vpnpds -v
