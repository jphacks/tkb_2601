name: Guardian Editor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Unity Editor scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("Assets/Editor")
          scripts = sorted(root.glob("*.cs"))

          assert len(scripts) >= 6, "Editor scripts missing"

          guids = []

          for script in scripts:
              source = script.read_text(encoding="utf-8-sig")
              assert "namespace Guardian.UnitySim.Editor" in source, script

              meta = Path(str(script) + ".meta")
              assert meta.is_file(), f"Missing metadata: {meta}"

              content = meta.read_text(encoding="utf-8-sig")
              match = re.search(
                  r"^guid:\s*([0-9a-fA-F]{32})\s*$",
                  content,
                  re.MULTILINE
              )
              assert match, f"Invalid GUID: {meta}"
              guids.append(match.group(1).lower())

          assert len(guids) == len(set(guids)), "Duplicate GUID"

          required = [
              "GuardianSceneSetup.cs",
              "RestaurantAssetPipeline.cs",
              "RestaurantEnvironmentEditor.cs",
              "RestaurantPeopleValidation.cs",
              "GuardianNekobotSetup.cs",
              "GuardianNekobotBatch.cs",
              "GuardianSettingsBatch.cs",
              "GuardianPedestrianBatch.cs",
              "GuardianInteractionBatch.cs",
              "GuardianSceneTools.cs",
              "GuardianSceneBatch.cs",
              "GuardianBatchRunner.cs",
              "GuardianIntegrationBatch.cs",
          ]

          for name in required:
              assert (root / name).is_file(), name

          assert Path("Assets/Scripts/GuardianSimulator.cs").is_file()

          scene_setup = (root / "GuardianSceneSetup.cs").read_text(encoding="utf-8-sig")
          assert "NewSceneMode.Additive" in scene_setup
          assert "SaveCurrentModifiedScenesIfUserWantsTo" in scene_setup
          assert "BackupExistingScene" in scene_setup
          assert "RestaurantEnvironmentEditor.Validate" in scene_setup
          assert "EditorBuildSettings.scenes.ToList()" in scene_setup

          nekobot_batch = (root / "GuardianNekobotBatch.cs").read_text(encoding="utf-8-sig")
          assert "EnsureBuildSettingsScene" in nekobot_batch

          print("Guardian Editor static checks passed")
          PY
