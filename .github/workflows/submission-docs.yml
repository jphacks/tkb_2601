name: Submission Documentation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-submission-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate judging documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path("README.md"),
              Path("docs/PUBLIC_SCOPE.md"),
              Path("docs/JUDGING_GUIDE.md"),
              Path("docs/SUBMISSION_CHECKLIST.md"),
              Path("docs/DEVELOPMENT_HISTORY.md"),
              Path("docs/BUSINESS.md"),
              Path("docs/SETUP.md"),
              Path("docs/HARDWARE_ASSEMBLY.md"),
              Path("docs/REAL_SENSOR_OPTIONS.md"),
              Path("docs/JPHACKS_JUDGING_AWARDS.md"),
              Path("docs/ASSET_LICENSE_STATUS.md"),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 500, path

          readme = required[0].read_text(encoding="utf-8")
          for section in [
              "# ロボもり",
              "## 動画リンク",
              "## 概要",
              "## この公開リポジトリで確認できる範囲",
              "## 特長",
              "### 独自技術",
          ]:
              assert section in readme, section

          image_names = [
              "familiar.png",
              "hero.png",
              "hijack.png",
              "mechanism.png",
              "offline-scenarios.png",
              "pitch-demo.png",
              "pitch-expansion.png",
              "pitch-roadmap.png",
              "pitch-system.png",
              "pitch-title.png",
              "pitch-usecase.png",
              "system-model.png",
          ]
          for name in image_names:
              image = Path("docs/images") / name
              assert image.is_file() and image.stat().st_size > 10000, image

          linked_documents = [required[0], *required[5:]]
          link_pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          for document in linked_documents:
              text = document.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.split("#", 1)[0]
                  if not target or re.match(r"^(?:https?://|mailto:)", target):
                      continue
                  resolved = (document.parent / target).resolve()
                  assert resolved.exists(), f"{document}: {target}"

          # The public README intentionally avoids event dates and development-timeline
          # claims. Supporting reference documents may retain dated evidence.
          timeless = readme
          timeless = re.sub(r"https?://\S+", "", timeless)
          assert not re.search(r"(?:19|20)\d{2}\s*年", timeless)
          assert not re.search(r"(?:19|20)\d{2}[-/]\d{1,2}[-/]\d{1,2}", timeless)
          assert not re.search(r"(?:Checked|確認基準|調査時点)\s*:", timeless, re.IGNORECASE)

          guide = Path("docs/JUDGING_GUIDE.md").read_text(encoding="utf-8")
          checklist = Path("docs/SUBMISSION_CHECKLIST.md").read_text(encoding="utf-8")
          history = Path("docs/DEVELOPMENT_HISTORY.md").read_text(encoding="utf-8")
          for warning in ["実機の安全", "実センサー", "GitHub Actions", "段階的なPR履歴"]:
              assert warning in guide, warning
          assert checklist.count("- [ ]") >= 10
          assert "自動的に成功扱いにしません" in checklist
          for number in range(1, 12):
              assert f"/pull/{number})" in history, number

          combined = "\n".join(path.read_text(encoding="utf-8") for path in required)
          assert not re.search(r"[A-Za-z]:[/\\]Users[/\\]", combined)
          assert "公開サンプル" in combined and "実運用" in combined
          assert "権利未確認素材" in combined
          print("Submission documentation checks passed")
          PY
