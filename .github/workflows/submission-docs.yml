name: Submission Documentation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-submission-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate judging documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path("README.md"),
              Path("docs/PUBLIC_SCOPE.md"),
              Path("docs/JUDGING_GUIDE.md"),
              Path("docs/SUBMISSION_CHECKLIST.md"),
              Path("docs/DEVELOPMENT_HISTORY.md"),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 500, path

          readme = required[0].read_text(encoding="utf-8")
          assert len(readme) >= 8000, "README must remain a complete judging entry point"
          for section in [
              "## 30秒でわかるロボもり",
              "## 解決したい課題",
              "## 仕組み",
              "## デモシナリオ",
              "## クイックスタート",
              "## 実装の見どころ",
              "## 検証とCI",
              "## 公開範囲と設定管理",
              "## 制約と今後の展開",
          ]:
              assert section in readme, section
          for evidence in [
              "```mermaid",
              "GuardianCapabilityPolicy.cs",
              "GuardianDishInventory.cs",
              "GuardianTrafficController.cs",
              "GuardianPedestrianSafety.cs",
              "Normal | ✓ | ✓ | ✓",
              "Warning | — | ✓ | ✓",
              "Limited | — | — | ✓",
          ]:
              assert evidence in readme, evidence
          for link in [
              "docs/JUDGING_GUIDE.md",
              "docs/SUBMISSION_CHECKLIST.md",
              "docs/DEVELOPMENT_HISTORY.md",
              "docs/PUBLIC_SCOPE.md",
          ]:
              assert link in readme, link
              assert Path(link).is_file(), link

          guide = Path("docs/JUDGING_GUIDE.md").read_text(encoding="utf-8")
          checklist = Path("docs/SUBMISSION_CHECKLIST.md").read_text(encoding="utf-8")
          history = Path("docs/DEVELOPMENT_HISTORY.md").read_text(encoding="utf-8")
          for warning in ["実機の安全", "実センサー", "GitHub Actions", "段階的なPR履歴"]:
              assert warning in guide, warning
          assert checklist.count("- [ ]") >= 10
          assert "自動的に成功扱いにしません" in checklist
          for number in range(1, 12):
              assert f"/pull/{number})" in history, number

          combined = "\n".join(path.read_text(encoding="utf-8") for path in required)
          assert not re.search(r"[A-Za-z]:[/\\]Users[/\\]", combined)
          assert "公開サンプル" in combined and "実運用" in combined
          assert "権利未確認素材" in combined
          print("Submission documentation checks passed")
          PY
