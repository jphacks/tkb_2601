# 門番。127.0.0.1 で受けた 2 つの入口だけを、外への道がない core ネットワークの中へ通す。
#   127.0.0.1:8000  → web（画面と API）
#   127.0.0.1:47612 → hub（Unity の GuardianHubLink がつなぐ先。中身はそのまま流す）
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    # コンテナを作り直して IP が変わっても追いかける（Docker の名前解決）
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;
        set $web http://web:8000;
        location / {
            proxy_pass $web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 15s;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $remote_addr $hub { default hub:47612; }
    server {
        listen 47612;
        proxy_pass $hub;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
        tcp_nodelay on;
    }
}
